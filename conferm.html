<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        color: #1f2a44;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, #ffffff, transparent 55%),
          linear-gradient(180deg, #b8ab92 0%, #bc9a55 100%);
      }
      div {
        padding: 15px;
        font-size: x-large;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      a {
        font-size: large;
        position: absolute;
        top: 60%;
        left: 71%;
        transform: translate(-50%, -50%);
        color: #1f2a44;
      }
      button {
        background-color: #1f2a44;
        color: white;
        border: 2px solid rgb(27, 68, 140);
        border-radius: 5px;
        padding: 8px;
        transition: transform 0.7s;
        cursor: pointer;
      }

      button:active {
        transform: translateX(600px);
      }
    </style>
    <title>Almond Hotel</title>
  </head>
  <body>
    <div>
      <h1>Your Booking has been confermed!</h1>
      <h2>Thank you for choosing us.</h2>
    </div>
    <a href="./home.html"><button>Home page</button></a>
  </body>
</html>
